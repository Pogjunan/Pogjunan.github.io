name: update-worldcup
on:
  schedule:
    - cron: "*/5 * * * *"        # 5분마다(UTC). GitHub이 수 분 지연·생략할 수 있어 라이브는 체감 5~15분 갱신
  workflow_dispatch: {}           # 저장소 Actions 탭에서 수동 실행 버튼
permissions:
  contents: write
concurrency:
  group: update-worldcup
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update index.html from football-data.org
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python build.py
      - name: Commit only if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "auto: update WC ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
